<body>
<div class="wrap">

  <div class="brand">
    <div class="dot">GLP</div>
    <div><b>Gestor La Plata</b><span id="rubro">Trámites registrales</span></div>
  </div>

  <div class="card">
    <h1>Seguí tu trámite</h1>
    <p class="sub">Ingresá el número que te dimos y tu apellido.</p>

    <form id="f" autocomplete="off">
      <div class="field">
        <label for="oblea">N° de seguimiento <span class="hint">— los números de tu oblea, sin la barra</span></label>
        <input id="oblea" name="oblea" inputmode="numeric" placeholder="19440205" required>
      </div>
      <div class="field">
        <label for="ape">Apellido <span class="hint">— del titular; si no entra, probá con el nombre</span></label>
        <input id="ape" name="ape" placeholder="Pérez" required>
      </div>
      <button class="go" id="btn" type="submit">Consultar</button>
    </form>

    <div class="msg err" id="err"></div>

    <div id="res">
      <div class="head">
        <div class="ob" id="rOb"></div>
        <div class="tip" id="rTipo"></div>
        <span class="pill" id="rPill"></span>
      </div>
      <ol class="pasos" id="rPasos"></ol>
      <div id="rLink"></div>
      <div class="arch" id="rArch"></div>
      <div id="rResena"></div>
      <div class="exp" id="rExp" style="display:none"></div>
      <div class="hist" id="rHist"></div>
      <div class="act" id="rAct"></div>
    </div>
  </div>

  <footer>
    ¿Dudas? <a href="https://wa.me/5492214886197" id="waFoot">Escribinos por WhatsApp</a>
  </footer>
</div>

<script>
(function(){
  'use strict';

  // ==================================================================
  // CÓMO SE ENCUENTRA EL TRÁMITE
  // ==================================================================
  // No hay base de datos ni servidor: cada trámite publicado es un archivo
  // chico dentro de /seguimiento/, cuyo nombre es una huella (SHA-256) de
  // la oblea más el apellido. Con los dos datos correctos se arma el nombre
  // y se pide ese archivo; sin ellos no hay nada que listar ni adivinar.
  // Esta misma función corre igual dentro de la app de gestión, así los dos
  // lados calculan exactamente el mismo nombre.
  var SAL = 'glp-seg-1';
  var CARPETA = '/seguimiento/';
  var WA = 'https://wa.me/5492214886197';   // el mismo que usa la web

  function sha256(txt){
    function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
    var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var s=String(txt), b=[], i, c;
    for (i=0;i<s.length;i++){
      c=s.charCodeAt(i);
      if (c<0x80) b.push(c);
      else if (c<0x800) b.push(0xc0|(c>>6),0x80|(c&63));
      else b.push(0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    }
    var bl=b.length*8;
    b.push(0x80); while (b.length%64!==56) b.push(0);
    b.push(0,0,0,0,(bl>>>24)&255,(bl>>>16)&255,(bl>>>8)&255,bl&255);
    var w=new Array(64), off,t,a,bb,cc,d,e,f,g,h,s0,s1,S0,S1,ch,mj,t1,t2;
    for (off=0; off<b.length; off+=64){
      for (t=0;t<16;t++) w[t]=((b[off+4*t]<<24)|(b[off+4*t+1]<<16)|(b[off+4*t+2]<<8)|b[off+4*t+3])|0;
      for (t=16;t<64;t++){
        s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
        s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
        w[t]=(((w[t-16]+s0)|0)+((w[t-7]+s1)|0))|0;
      }
      a=H[0];bb=H[1];cc=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
      for (t=0;t<64;t++){
        S1=rr(e,6)^rr(e,11)^rr(e,25);
        ch=(e&f)^((~e)&g);
        t1=(((h+S1)|0)+((ch+((K[t]+w[t])|0))|0))|0;
        S0=rr(a,2)^rr(a,13)^rr(a,22);
        mj=(a&bb)^(a&cc)^(bb&cc);
        t2=(S0+mj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    var out='';
    for (i=0;i<8;i++) out += ('00000000'+((H[i]>>>0).toString(16))).slice(-8);
    return out;
  }
  function norm(s){
    return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase().replace(/[^a-z0-9]/g,'');
  }
  function obleaKey(s){ return String(s==null?'':s).replace(/[^0-9]/g,''); }
  // Se prueba lo que escribió entero, su primera palabra y su última: así
  // entra tanto con el apellido solo como con el nombre completo, y tanto
  // si en la ficha quedó "Caballero, Cesar" como "Cesar Caballero".
  function cands(s){
    s = String(s||'').trim();
    var w = s.split(/\s+/).filter(function(x){ return x; });
    var out = [];
    var agregar = function(v){
      var n = norm(v);
      if (n && n.length >= 2 && out.indexOf(n) < 0) out.push(n);
    };
    agregar(s);
    if (w.length){ agregar(w[0]); agregar(w[w.length-1]); }
    return out;
  }
  function claves(oblea, ape){
    var ok = obleaKey(oblea);
    if (!ok) return [];
    return cands(ape).map(function(a){ return sha256(SAL+'|'+ok+'|'+a).slice(0,40); });
  }

  // Los pasos por defecto son los de RPBA. Cada archivo puede traer los
  // suyos (una inscripción de divorcio recorre otro camino), y entonces
  // mandan esos: la página no necesita saber qué categorías existen.
  var PASOS_DEF = [
    'Solicitud recibida',
    'Ingresada en el Registro de la Propiedad',
    'Informe emitido por el Registro',
    'Informe disponible'
  ];
  var PASOS = PASOS_DEF;
  var PILL = {
    recibido:  ['espera','Recibida'],
    proceso:   ['espera','En proceso'],
    demora:    ['demora','Demorada'],
    salida:    ['espera','Casi listo'],
    observado: ['obs','Necesita una corrección'],
    listo:     ['listo','Listo']
  };

  var $ = function(id){ return document.getElementById(id); };
  var elErr = $('err'), elRes = $('res'), elBtn = $('btn');

  function error(txt){
    elRes.className = '';
    elErr.innerHTML = txt;
    elErr.className = 'msg err show';
  }
  function limpiar(){ elErr.className = 'msg err'; elRes.className = ''; }

  function fechaLinda(iso){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return '';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function pintar(d){
    $('rOb').textContent = 'N° ' + (d.oblea || '');
    $('rTipo').textContent = d.tipo || 'Trámite registral';
    var pl = PILL[d.estado] || PILL.proceso;
    var pill = $('rPill');
    pill.className = 'pill ' + pl[0];
    pill.textContent = pl[1];

    PASOS = (d.pasos && d.pasos.length) ? d.pasos : PASOS_DEF;
    // Bajo la marca va el rubro del trámite que se está consultando: una
    // inscripción de divorcio no es un trámite registral.
    var rb = $('rubro');
    if (rb && d.rubro) rb.textContent = d.rubro;
    var paso = Number(d.paso) || 1;
    var alerta = (d.estado === 'observado' || d.estado === 'demora');
    var ol = $('rPasos');
    ol.innerHTML = '';
    for (var i = 0; i < PASOS.length; i++){
      var n = i + 1;
      var li = document.createElement('li');
      var clase = (n < paso) ? 'ok' : (n === paso ? 'now' : '');
      if (n === paso && alerta) clase += ' alerta';
      // El último paso se marca cumplido solo cuando el informe está de verdad
      if (n === paso && paso === PASOS.length && d.estado === 'listo') clase = 'ok';
      li.className = clase;
      var mk = document.createElement('div');
      mk.className = 'mark';
      mk.textContent = (clase.indexOf('ok') === 0) ? '✓' : (n === paso ? '•' : n);
      var tx = document.createElement('div');
      tx.className = 'ptxt';
      tx.textContent = PASOS[i];
      var nota = function(t){
        if (!t) return;
        var e = document.createElement('div');
        e.className = 'nota';
        e.textContent = t;
        tx.appendChild(e);
      };
      if (n === paso && d.texto && d.texto !== PASOS[i]) nota(d.texto);
      // La fecha en que el trámite llegó a este paso. El primero siempre la
      // tiene (es cuando se pidió); los demás, desde que se empezó a anotar.
      var fp = (d.fechas && d.fechas[n]) || (i === 0 ? d.fecha : '');
      if (fp) nota(fechaLinda(fp));
      // En el último paso, mientras no esté listo, va el plazo contratado y
      // la fecha estimada que sale de él.
      if (n === PASOS.length && d.estado !== 'listo'){
        if (d.plazo && d.plazo.max){
          var pz = d.plazo.txt || (d.plazo.mod + ' · ' + (d.plazo.min === d.plazo.max
            ? (d.plazo.max + ' día' + (d.plazo.max === 1 ? '' : 's') + ' hábil' + (d.plazo.max === 1 ? '' : 'es'))
            : (d.plazo.min + ' a ' + d.plazo.max + ' días hábiles')));
          // Algunos plazos no se cuentan desde que el cliente lo pide sino
          // desde que el trámite entra al organismo: hay que aclararlo o la
          // cuenta no le va a cerrar.
          if (d.plazo.nota) pz += ' ' + d.plazo.nota;
          nota(pz);
        }
        if (d.est && d.est.min){
          nota(d.est.min === d.est.max
            ? ('Estimado para el ' + fechaLinda(d.est.min))
            : ('Estimado entre el ' + fechaLinda(d.est.min) + ' y el ' + fechaLinda(d.est.max)));
        }
      }
      li.appendChild(mk); li.appendChild(tx);
      ol.appendChild(li);
    }

    var cl = $('rLink');
    cl.innerHTML = '';
    // Si quedó saldo, no hay informe ni carpeta que mostrar: no vienen
    // en el archivo. Lo único que se muestra es que falta abonarlo y el
    // botón de WhatsApp.
    if (d.debe){
      var av = document.createElement('div');
      av.className = 'deuda';
      var t1 = document.createElement('div');
      t1.className = 'dtit';
      t1.textContent = 'Tu trámite está listo';
      var t2 = document.createElement('div');
      t2.className = 'dtxt';
      t2.textContent = 'Queda un saldo pendiente de $ ' + miles(d.debe)
        + '. Apenas lo abonás te habilitamos la descarga acá mismo.';
      av.appendChild(t1); av.appendChild(t2);
      cl.appendChild(av);
      var wd = document.createElement('a');
      wd.className = 'wa'; wd.href = WA; wd.target = '_blank'; wd.rel = 'noopener';
      wd.textContent = 'Escribinos para abonarlo';
      cl.appendChild(wd);
      pintarExpediente(d.exp);
      pintarHistorial(d.otros);
      $('rAct').textContent = d.act ? ('\u00daltima actualización: ' + fechaLinda(d.act)) : '';
      elRes.className = 'show';
      return;
    }
    if (d.link){
      // Es el mismo link del Registro todo el tiempo: mientras el tramite
      // corre muestra el estado oficial, y cuando sale, el informe firmado.
      // Lo unico que cambia es como se lo nombra. La direccion no se muestra.
      var a = document.createElement('a');
      a.className = (d.estado === 'listo') ? 'dl' : 'dl encurso';
      a.href = d.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = (d.estado === 'listo')
        ? 'Ver / descargar el informe'
        : 'Ver estado en el Registro';
      cl.appendChild(a);
    } else if (d.estado === 'listo' && !d.carpeta){
      // Sin link del Registro y sin carpeta no hay de dónde bajarlo:
      // ahí sí corresponde que escriba. Si tiene carpeta, más abajo están
      // los archivos con su botón de descarga, y este cartel se
      // contradecía con lo que el cliente veía tres centímetros más abajo.
      var w = document.createElement('a');
      w.className = 'wa'; w.href = WA; w.target = '_blank'; w.rel = 'noopener';
      w.textContent = 'Tu informe está listo — escribinos para que te lo pasemos';
      cl.appendChild(w);
    } else if (d.estado === 'observado'){
      var w2 = document.createElement('a');
      w2.className = 'wa'; w2.href = WA; w2.target = '_blank'; w2.rel = 'noopener';
      w2.textContent = 'Consultar por WhatsApp';
      cl.appendChild(w2);
    }

    // La carpeta del cliente en Drive. Es el lugar donde le quedan los
    // archivos de este tramite cuando el chat de WhatsApp se llena y no
    // los encuentra mas. Va debajo del informe, no arriba: lo primero que
    // el cliente quiere es su informe.
    if (d.carpeta){
      var cp = document.createElement('a');
      cp.className = 'dl encurso';
      cp.href = d.carpeta;
      cp.target = '_blank';
      cp.rel = 'noopener';
      cp.textContent = 'Abrir tu carpeta con los archivos';
      cl.appendChild(cp);
    }

    pintarArchivos(d.carpeta);
    pintarResena(d);
    pintarExpediente(d.exp);
    pintarHistorial(d.otros);

    $('rAct').textContent = d.act ? ('Última actualización: ' + fechaLinda(d.act)) : '';
    elRes.className = 'show';
  }


  // Los otros tramites del mismo cliente. Vienen dentro del archivo del
  // tramite consultado: con una sola oblea ve todo lo suyo, sin tener que
  // buscar de a uno ni escribirnos para preguntar.

  // El expediente de la Provincia. El sistema oficial no pide el número
  // entero: pide el año, el número y la repartición en tres campos. Si le
  // damos el número completo, el cliente lo pega donde no va y le dice que
  // no existe. Así que se lo damos partido, con un botón para copiar cada
  // pedazo y el paso a paso del formulario.
  function copiar(txt, boton){
    var listo = function(){
      var antes = boton.textContent;
      boton.textContent = 'Copiado';
      setTimeout(function(){ boton.textContent = antes; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(listo, function(){});
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); listo(); } catch(e){}
    document.body.removeChild(ta);
  }
  function campo(label, valor){
    var d = document.createElement('div');
    d.className = 'campo';
    var c = document.createElement('code');

    var b = document.createElement('button');
    b.className = 'cp'; b.type = 'button'; b.textContent = 'Copiar';
    b.onclick = function(){ copiar(valor, b); };
    d.appendChild(c); d.appendChild(b);
    var li = document.createElement('li');
    li.appendChild(document.createTextNode(label));
    li.appendChild(d);
    return li;
  }

  // La direccion del script de Drive. Se escribe al publicar, desde la app.
  // Si Drive no esta conectado queda vacia y este bloque no hace nada.
  var DRV_API = 'https://script.google.com/macros/s/AKfycbzD64B-CKZnwv6A6nimmo09eZ3j70WBmHAE1Y60AeUcvp58Av6ilhJefBr_GlZ45puBCg/exec';
  var _archPedido = 0;

  // Los archivos del cliente, leidos de su carpeta de Drive en el momento.
  // No se publican en ningun archivo: la pagina los pide cuando hace falta.
  // Por eso aparece lo que subas a mano, no solo lo que archiva la app.
  //
  // Va por JSONP y no por fetch porque Apps Script no manda las cabeceras
  // que el navegador exige para leer una respuesta de otro dominio.
  function pintarArchivos(urlCarpeta){
    var cont = $('rArch');
    cont.innerHTML = '';
    if (!DRV_API || !urlCarpeta) return;
    var m = String(urlCarpeta).match(/folders\/([A-Za-z0-9_-]+)/);
    if (!m) return;

    _carpetaActual = m[1];
    var mio = ++_archPedido;   // si consulta otro tramite, descartar el viejo
    var cb = 'glpArch' + mio + '_' + Date.now();
    var tag = document.createElement('script');
    var listo = false;
    var limpiar = function(){
      try { delete window[cb]; } catch(e){ window[cb] = undefined; }
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    };
    window[cb] = function(r){
      listo = true; limpiar();
      if (mio !== _archPedido) return;
      if (!r || !r.ok || !r.archivos || !r.archivos.length) return;
      dibujarArchivos(cont, r.archivos);
    };
    // Si el script no contesta, no pasa nada: el resto de la pagina ya
    // esta a la vista y el cliente igual tiene el boton de la carpeta.
    tag.onerror = limpiar;
    setTimeout(function(){ if (!listo) limpiar(); }, 20000);
    tag.src = DRV_API + (DRV_API.indexOf('?') >= 0 ? '&' : '?')
      + 'accion=listar&carpeta=' + encodeURIComponent(m[1])
      + '&callback=' + cb;
    document.head.appendChild(tag);
  }

  function miles(n){
    return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function pesoLindo(b){
    b = Number(b) || 0;
    if (b < 1024) return b + ' B';
    if (b < 1048576) return Math.round(b / 1024) + ' KB';
    return (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
  }

  function dibujarArchivos(cont, lista){
    var h2 = document.createElement('h2');
    h2.textContent = 'Tus archivos';
    var cap = document.createElement('p');
    cap.className = 'cap';
    cap.textContent = 'Todo lo de tus tr\u00e1mites, en un solo lugar. '
      + 'Los guardamos ac\u00e1 para que no tengas que buscarlos en el chat.';
    cont.appendChild(h2); cont.appendChild(cap);

    // Lo mas nuevo se marca, pero solo si de verdad es de los ultimos dias:
    // decirle «Nuevo» a un archivo de hace ocho meses es mentirle.
    var hoy = new Date();
    for (var i = 0; i < lista.length; i++){
      var a = lista[i];
      var fil = document.createElement('div');
      fil.className = 'fil';

      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'fchk';
      chk.value = a.id || '';
      chk.checked = true;
      if (!a.id) chk.style.display = 'none';

      var izq = document.createElement('div');
      izq.style.flex = '1';
      var nom = document.createElement('div');
      nom.className = 'fnom';
      nom.textContent = a.nombre || 'Archivo';
      if (i === 0 && a.fecha){
        var dias = (hoy - new Date(a.fecha + 'T00:00:00')) / 86400000;
        if (dias >= 0 && dias <= 14){
          var nue = document.createElement('span');
          nue.className = 'fnue';
          nue.textContent = 'Nuevo';
          nom.appendChild(nue);
        }
      }
      var met = document.createElement('div');
      met.className = 'fmet';
      met.textContent = (a.fecha ? fechaLinda(a.fecha) : '')
        + (a.bytes ? ((a.fecha ? ' \u00b7 ' : '') + pesoLindo(a.bytes)) : '');
      izq.appendChild(nom); izq.appendChild(met);

      // Dos botones: ver y bajar. Mucha gente quiere mirarlo antes de
      // llenarse la carpeta de Descargas, y en el celular abrir el PDF
      // bajado es más trabajo que mirarlo en el momento.
      var acc = document.createElement('div');
      acc.className = 'facc';
      if (a.id){
        var ver = document.createElement('a');
        ver.className = 'fver';
        ver.href = 'https://drive.google.com/file/d/' + a.id + '/view';
        ver.target = '_blank';
        ver.rel = 'noopener';
        ver.textContent = 'Ver';
        acc.appendChild(ver);
      }
      var baj = document.createElement('a');
      baj.className = 'fbaj';
      baj.href = a.url;
      baj.rel = 'noopener';
      baj.textContent = 'Descargar';
      acc.appendChild(baj);

      fil.appendChild(chk); fil.appendChild(izq); fil.appendChild(acc);
      cont.appendChild(fil);
    }
    dibujarEnvioMail(cont);
  }

  // El cliente marca lo que quiere y pone su mail: le llega todo adjunto,
  // mandado desde la casilla de Gestor La Plata. Si contesta, contesta al
  // mail de verdad.
  var _carpetaActual = '';

  function dibujarEnvioMail(cont){
    if (!DRV_API || !_carpetaActual) return;
    var caja = document.createElement('div');
    caja.className = 'envio';

    var tit = document.createElement('div');
    tit.className = 'etit';
    tit.textContent = '\u00bfPrefer\u00eds que te los mandemos por mail?';
    caja.appendChild(tit);

    var sub = document.createElement('div');
    sub.className = 'esub';
    sub.textContent = 'Te llegan los que dejaste marcados arriba.';
    caja.appendChild(sub);

    var fila = document.createElement('div');
    fila.className = 'efila';
    var inp = document.createElement('input');
    inp.type = 'email';
    inp.className = 'email';
    inp.placeholder = 'tunombre@mail.com';
    inp.autocomplete = 'email';
    var bot = document.createElement('button');
    bot.type = 'button';
    bot.className = 'ebtn';
    bot.textContent = 'Envi\u00e1rmelos';
    fila.appendChild(inp); fila.appendChild(bot);
    caja.appendChild(fila);

    var res = document.createElement('div');
    res.className = 'eres';
    caja.appendChild(res);
    cont.appendChild(caja);

    bot.onclick = function(){
      var mail = String(inp.value || '').trim();
      if (!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(mail)){
        res.className = 'eres mal';
        res.textContent = 'Revis\u00e1 el mail, parece que falta algo.';
        inp.focus();
        return;
      }
      var ids = [];
      var cks = cont.querySelectorAll('.fchk');
      for (var i = 0; i < cks.length; i++) if (cks[i].checked && cks[i].value) ids.push(cks[i].value);
      if (!ids.length){
        res.className = 'eres mal';
        res.textContent = 'Marc\u00e1 al menos un archivo.';
        return;
      }

      bot.disabled = true;
      var antes = bot.textContent;
      bot.textContent = 'Enviando\u2026';
      res.className = 'eres';
      res.textContent = '';

      var cb = 'glpMail' + Date.now();
      var tag = document.createElement('script');
      var listo = false;
      var limpiar = function(){
        try { delete window[cb]; } catch(e){ window[cb] = undefined; }
        if (tag.parentNode) tag.parentNode.removeChild(tag);
        bot.disabled = false; bot.textContent = antes;
      };
      window[cb] = function(r){
        listo = true; limpiar();
        if (r && r.ok){
          res.className = 'eres bien';
          res.textContent = r.adjuntos
            ? ('\u2713 Listo, te lo mandamos a ' + mail + '. Si no lo ves, mir\u00e1 en spam.')
            : ('\u2713 Listo, te lo mandamos a ' + mail + '. Como pesaban bastante, el mail lleva los enlaces de descarga.');
          bot.disabled = true;
        } else {
          res.className = 'eres mal';
          res.textContent = (r && r.error) ? r.error : 'No se pudo enviar. Escribinos por WhatsApp.';
        }
      };
      tag.onerror = function(){
        limpiar();
        res.className = 'eres mal';
        res.textContent = 'No se pudo enviar. Escribinos por WhatsApp.';
      };
      setTimeout(function(){ if (!listo){ tag.onerror(); } }, 60000);
      tag.src = DRV_API + (DRV_API.indexOf('?') >= 0 ? '&' : '?')
        + 'accion=enviar&carpeta=' + encodeURIComponent(_carpetaActual)
        + '&mail=' + encodeURIComponent(mail)
        + '&ids=' + encodeURIComponent(ids.join(','))
        + '&callback=' + cb;
      document.head.appendChild(tag);
    };
  }

  function buscarClave(k){
    return fetch(CARPETA + k + '.json', { cache: 'no-store' }).then(function(r){
      if (!r.ok) return null;
      return r.json().catch(function(){ return null; });
    }).catch(function(){ return null; });
  }

  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    limpiar();
    var ob = $('oblea').value, ap = $('ape').value;
    if (!obleaKey(ob)){ error('Revisá el número de seguimiento: son solo números, por ejemplo <b>19440205</b>.'); return; }
    if (!norm(ap)){ error('Escribí el apellido del titular de la solicitud.'); return; }
    var ks = claves(ob, ap);
    elBtn.disabled = true; elBtn.textContent = 'Buscando…';

    (function siguiente(i){
      if (i >= ks.length){
        elBtn.disabled = false; elBtn.textContent = 'Consultar';
        error('No encontramos un trámite con esos datos.<br><br>Verificá que el <b>número</b> esté completo (son todos los dígitos de la oblea, incluido el último, el que va después de la barra) y que el <b>nombre</b> sea el del titular de la solicitud. Probá también con el nombre y el apellido completos. Si sigue sin aparecer, <a href="' + WA + '" target="_blank" rel="noopener">escribinos por WhatsApp</a> y lo vemos.');
        return;
      }
      buscarClave(ks[i]).then(function(d){
        if (d && typeof d === 'object'){
          elBtn.disabled = false; elBtn.textContent = 'Consultar';
          pintar(d);
          elRes.scrollIntoView({ behavior:'smooth', block:'nearest' });
        } else {
          siguiente(i + 1);
        }
      });
    })(0);
  });

  var wf = $('waFoot'); if (wf) wf.href = WA;

  // El link que le mandamos por WhatsApp ya trae los dos datos puestos y se
  // consulta solo: el cliente no tipea nada.
  //
  // Van despues de # y no de ?, porque el camino hasta aca tiene saltos
  // (gestorlaplata.com -> www -> /seguimiento.html) y en cada salto un ? se
  // puede perder. Lo que va despues del # ni siquiera viaja al servidor: lo
  // arrastra el navegador intacto. Igual se aceptan los dos, por los links
  // viejos que ya andan dando vueltas.
  var qs = new URLSearchParams(location.search);
  if (!qs.get('o') && location.hash.length > 1){
    qs = new URLSearchParams(location.hash.slice(1));
  }
  var qo = qs.get('o'), qa = qs.get('a');
  if (qo) $('oblea').value = qo;
  if (qa) $('ape').value = qa;
  if (qo && qa){
    if (typeof $('f').requestSubmit === 'function') $('f').requestSubmit();
    else $('f').dispatchEvent(new Event('submit', { cancelable:true }));
  }
})();
</script>
</body>
</html>
